kind = "mobile"
previewPath = "/"
title = "PetalPlot"
version = "1.0.0"
id = "artifacts/petalplot"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24960

[services.development]
run = "pnpm --filter @workspace/petalplot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/petalplot", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/petalplot", "run", "serve" ]

[services.env]
PORT = "24960"
BASE_PATH = "/"
